# Configurazione di Pages CMS (https://pagescms.org): una sezione per pagina, in italiano.
# NON modificare a mano: si rigenera dagli schemi con «node scripts/pages-cms.mjs» e si controlla con
# «node scripts/valida-pages.mjs». Nei titoli: *parola* = corsivo, **parola** = colore blu.
media:
  - name: media
    label: Immagini e video del sito
    input: public/media
    output: /media
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
      - svg
      - mp4
      - webm
  - name: newsletter
    label: Immagini della newsletter
    input: public/newsletter
    output: /newsletter
    extensions:
      - jpg
      - jpeg
      - png
      - webp
content:
  - name: home
    label: Home
    type: file
    path: src/content/pagine/home.yml
    format: yaml
    fields:
      - name: seo
        label: Ricerca e condivisione
        type: object
        fields:
          - name: titolo
            label: Titolo nella scheda del browser
            type: string
            required: true
          - name: descrizione
            label: Descrizione per Google e per le anteprime
            description: Una o due frasi, al massimo 160 caratteri.
            type: text
            required: true
          - name: immagine
            label: Immagine di condivisione
            description: Anteprima quando la pagina viene condivisa (1200×630).
            type: object
            fields:
              - name: src
                label: File
                description: Un file in public/media (foto/, progetti/, icone/, strumenti/, prove/).
                type: image
                required: true
              - name: alt
                label: Testo alternativo
                description: Cosa si vede, in una frase. Vuoto solo se l'immagine è decorativa.
                type: string
                required: true
              - name: punto_focale
                label: Punto focale
                description: La parte da tenere sempre visibile quando l'immagine viene ritagliata.
                type: select
                options:
                  values:
                    - centro
                    - alto
                    - basso
                    - sinistra
                    - destra
                required: true
              - name: adatta
                label: Adatta
                description: riempi = riempie il riquadro e può tagliare i bordi; intera = mostra tutta l'immagine (per gli screenshot verticali).
                type: select
                options:
                  values:
                    - riempi
                    - intera
                required: true
            required: true
        required: true
      - name: apertura
