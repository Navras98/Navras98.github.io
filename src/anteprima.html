<!doctype html>
<!-- Sorgente dell'anteprima social. Si rende a 1200x630 con un browser headless
     e si salva in assets/img/anteprima.png. Stessi token del sito. -->
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #0b0e12;
    color: #edf0f3;
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    padding: 76px 84px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  body::after {
    content: '';
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(0deg,
      rgba(255,255,255,.03) 0, rgba(255,255,255,.03) 1px,
      transparent 1px, transparent 3px);
  }
  .ann {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 15px; font-weight: 500; text-transform: uppercase;
    letter-spacing: .06em; color: #f0503c;
  }
  h1 {
    font-size: 92px; line-height: .94; letter-spacing: -.045em;
    font-weight: 700; font-variation-settings: 'wdth' 92, 'opsz' 84;
    margin-top: 18px;
  }
  p {
    margin-top: 26px; max-width: 720px;
    font-size: 25px; line-height: 1.38; letter-spacing: -.01em;
    font-weight: 400; color: #aeb6c0;
  }
  .base {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid rgba(255,255,255,.14); padding-top: 22px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 15px; letter-spacing: .06em; text-transform: uppercase;
    color: #7a838f;
  }
  svg { position: absolute; right: -40px; top: 96px; width: 460px; opacity: .95; }
</style>
</head>
<body>
  <svg viewBox="0 0 320 300" aria-hidden="true">
    <g fill="none" stroke="#262e38" stroke-width="1.5">
      <path d="M30 210 L190 210 L280 250 L120 250 Z"/>
      <path d="M46 150 L206 150 L296 190 L136 190 Z"/>
      <path d="M62 90 L222 90 L312 130 L152 130 Z"/>
    </g>
    <g stroke="#39424e" stroke-width="1.5">
      <path d="M92 230 L108 170"/><path d="M160 230 L176 170"/>
      <path d="M228 230 L244 170"/><path d="M124 170 L140 110"/>
      <path d="M196 170 L212 110"/>
    </g>
    <g fill="#aeb6c0">
      <rect x="86" y="224" width="12" height="12" transform="rotate(45 92 230)"/>
      <rect x="154" y="224" width="12" height="12" transform="rotate(45 160 230)"/>
      <rect x="222" y="224" width="12" height="12" transform="rotate(45 228 230)"/>
      <rect x="118" y="164" width="11" height="11" transform="rotate(45 123.5 169.5)"/>
      <rect x="190" y="164" width="11" height="11" transform="rotate(45 195.5 169.5)"/>
    </g>
    <g fill="#edf0f3">
      <rect x="134" y="104" width="12" height="12" transform="rotate(45 140 110)"/>
      <rect x="206" y="104" width="12" height="12" transform="rotate(45 212 110)"/>
    </g>
    <rect x="169" y="164" width="14" height="14" transform="rotate(45 176 171)" fill="#f0503c"/>
  </svg>

  <div>
    <p class="ann">Architetture di agenti AI</p>
    <h1>Andrea Sforna</h1>
    <p>Più agenti con ruoli separati, confini imposti dal sistema e non dalle istruzioni, risposte sui dati che si possono verificare.</p>
  </div>

  <div class="base">
    <span>navras98.github.io</span>
    <span>Progettazione · Sicurezza · Esercizio</span>
  </div>
</body>
</html>
