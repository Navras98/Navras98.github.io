    alt: Andrea Sforna, consulente informatico per gli agenti AI
    punto_focale: centro
    adatta: riempi

apertura:
  titolo: Agenti AI che *restano tuoi.*
  testo: Progetto, costruisco e metto in sicurezza agenti AI per le aziende. Lavorano sui tuoi dati, sui tuoi computer, e chiedono il permesso prima di agire.
  bottone_principale:
    etichetta: Scrivimi
    link: /contatti/
  bottone_secondario:
    etichetta: Il mio metodo
    link: /metodo/
  riga:
