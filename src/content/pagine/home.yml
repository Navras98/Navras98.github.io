# Home. Nei titoli: *parola* = corsivo, **parola** = colore blu.
seo:
  titolo: Andrea Sforna · agenti AI per le aziende
  descrizione: Consulente informatico. Progetto, costruisco e metto in sicurezza agenti AI per le aziende, sui loro dati e sui loro computer.
  immagine:
