# English page for the newsletter (/en/newsletter/). The newsletter itself is written in Italian.
seo:
  titolo: Newsletter (in Italian)
  descrizione: The newsletter on artificial intelligence by Andrea Sforna is written in Italian. You can subscribe here; past issues are on the Italian page.
  immagine:
    src: /media/condivisione.jpg
    alt: Andrea Sforna, consultant for AI agents
    punto_focale: centro
    adatta: riempi
apertura:
  etichetta: Newsletter
  titolo: This newsletter is written *in Italian.*
  testo: The sources are in several languages. Each story links to the original article.
archivio_link:
  etichetta: Read it in Italian
  link: /newsletter/
ultimo:
  etichetta: Latest issue
  link: Read it, in Italian
indice: Sections of this page
cosa_e:
  etichetta: What it is
  didascalia: One short email
  titolo: An email, *only when something matters.*
  testo: Five stories, picked from dozens of sources by an automation I built. Each one says what happened, why it matters and what actually changes. I approve every issue before it is sent. No advertising, no hidden sponsors. Your address is used only for the newsletter.
resto:
  etichetta: The rest of the site
  didascalia: In Italian
  titolo: Who I am and *how I work.*
  testo: I am a technology consultant based in Italy. I design, build and secure AI agents for companies, on their own data and computers. Every action that changes something waits for a person's approval.
  link:
    etichetta: Home page, in Italian
    link: /
