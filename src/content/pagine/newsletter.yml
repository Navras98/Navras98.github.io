link_non_valido:
  etichetta: Newsletter
  titolo: Questo collegamento *non vale più.*
  testo: O l'hai già usato per confermare, o è scaduto. Rimetti l'indirizzo qui sotto e te ne mando un altro.
  nota: Se anche questa volta non va, scrivimi ad andrea.sforna@gmail.com e ti iscrivo io.
