contributi:
  etichetta: Tutte le proposte
  didascalia: Link, data e stato
  titolo: Ogni proposta, *con il suo stato.*
  testo: >-
    Integrata vuol dire accettata nel progetto. In revisione vuol dire ancora aperta. Proposta vuol dire chiusa senza integrazione, spesso perché la stessa
    correzione è entrata in un altro modo.
  altre: Le altre proposte, in revisione o chiuse
  voci:
    - progetto: OpenClaw
      numero: 170951
      titolo: >-
        Modifica del fondatore, con me coautore: se cambia la configurazione mentre un’attività pianificata sta riprovando, OpenClaw non si riavvia più del
        tutto e gli agenti continuano a lavorare.
      stato: integrata
      data: '2026-10-13'
      link: https://github.com/openclaw/openclaw/pull/170951
    - progetto: OpenClaw
      numero: 148879
      titolo: Quando un aggiornamento di OpenClaw non si completa, il riepilogo indica il passaggio preciso da controllare invece di un motivo sconosciuto.
      stato: integrata
      data: '2026-09-19'
      link: https://github.com/openclaw/openclaw/pull/148879
    - progetto: OpenClaw
      numero: 147229
      titolo: Nella guida di OpenClaw per Telegram spiego quale strumento invia i messaggi con i pulsanti.
      stato: integrata
      data: '2026-09-13'
