progetto_mio:
  etichetta: Il mio progetto
  didascalia: Codice aperto, licenza MIT
  titolo: PrivacyBridge, *aperto a tutti.*
  testo: Toglie i dati personali da un testo prima di darlo a un'AI e poi li rimette al loro posto. Il codice è pubblico, chiunque può leggerlo e verificarlo.
  immagine:
    src: /media/progetti/privacybridge-prima-dopo.webp
    alt: "Sopra il messaggio originale con nome, luogo e data di nascita, IBAN, email e targa evidenziati, sotto lo stesso messaggio con i segnaposto al loro posto"
    punto_focale: centro
    adatta: intera
  link:
    etichetta: Codice su GitHub
    link: https://github.com/Navras98/PrivacyBridge
