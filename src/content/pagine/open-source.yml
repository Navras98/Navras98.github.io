    - progetto: OpenClaw
      numero: 147222
      titolo: Nella guida di OpenClaw per Telegram spiego come vengono custoditi i messaggi in arrivo e cosa succede se il programma si riavvia.
      stato: integrata
      data: '2026-09-13'
      link: https://github.com/openclaw/openclaw/pull/147222
    - progetto: OpenClaw
      numero: 149335
      titolo: Propongo che, dopo un riavvio, una risposta formattata rimasta in sospeso arrivi come testo semplice invece di andare persa.
      stato: in revisione
      data: '2026-09-15'
      link: https://github.com/openclaw/openclaw/pull/149335
    - progetto: OpenClaw
      numero: 148275
      titolo: Propongo che, quando un fornitore segnala il credito esaurito, OpenClaw passi al modello di riserva come per un limite di richieste.
      stato: in revisione
      data: '2026-09-14'
      link: https://github.com/openclaw/openclaw/pull/148275
    - progetto: OpenClaw
      numero: 147490
      titolo: Propongo che la verifica della configurazione avvisi quando una lista di permessi vuota finisce per consentire tutto.
      stato: in revisione
      data: '2026-09-14'
