# Pagina Open source. Stati verificati con gh il 2026-10-14: integrata = accettata nel progetto,
# in revisione = ancora aperta, proposta = chiusa senza integrazione. La data è quella dell'integrazione,
# dell'apertura (in revisione) o della chiusura (proposta). Ricontrolla con: node scripts/controlla-github.mjs
seo:
  titolo: Open source
  descrizione: I miei contributi a OpenClaw e i ringraziamenti del fondatore. Ogni mia proposta con il suo stato, e PrivacyBridge, il mio progetto aperto.
  immagine:
    src: /media/condivisione.jpg
    alt: Andrea Sforna, consulente informatico per gli agenti AI
    punto_focale: centro
    adatta: riempi
apertura:
  etichetta: Open source
  titolo: Contribuisco al software *che uso.*
  testo: >-
    Open source vuol dire che il codice è pubblico e chiunque può proporre miglioramenti. Chi guida il progetto li controlla e decide cosa accettare. Su GitHub
    mi chiamo Navras98. Qui trovi ogni mia proposta con il link, la data e lo stato, anche quelle non accettate.
  verificato: Stato verificato su GitHub il 14 ottobre 2026
  video:
    mp4: /media/video/github-grazie.mp4
    webm: /media/video/github-grazie.webm
    copertina: /media/video/github-grazie.jpg
    descrizione: Una mia modifica integrata in OpenClaw su GitHub, con il ringraziamento a Navras98.
    punto_focale: centro
    adatta: riempi
