schede:
  etichetta: Come li uso
  didascalia: Screenshot reali
  titolo: Ogni strumento *ha il suo lavoro.*
  voci:
    - nome: Claude Code
      titolo: Il mio strumento *principale.*
      come_lo_uso: Ci lavoro ogni giorno. Con Claude Code ho costruito SfornaClaw, PrivacyBridge e questo sito. Lavoro per missioni scritte, un file con il metodo, i punti da fare e i criteri per dire che un punto è fatto. Claude Code legge la missione, propone ogni modifica e aspetta il mio sì.
      immagine: { src: /media/strumenti/uso/claude-code.webp, alt: "Chiedo a Claude Code di leggere la missione di SfornaClaw e di scrivere i passi per la prova con il bot Telegram vero: legge i file, scrive il documento e spiega cosa ha fatto, in otto passi", punto_focale: centro, adatta: intera }
      immagine_telefono: { src: /media/strumenti/uso/claude-code-telefono.webp, alt: "La stessa richiesta dal telefono: Claude Code legge la missione, scrive il documento con i passi della prova e spiega cosa ha fatto", punto_focale: centro, adatta: intera }
      accanto:
        immagine: { src: /media/strumenti/uso/missione.webp, alt: "Un estratto vero di una missione di SfornaClaw: il metodo (riprodurre ogni difetto, trovare la causa vera, aggiungere il test), quattro punti con il loro criterio e il loro stato, e i divieti", punto_focale: centro, adatta: intera }
        immagine_telefono: { src: /media/strumenti/uso/missione-telefono.webp, alt: "Un estratto vero di una missione di SfornaClaw: due regole del metodo e il punto D6, la prova con il bot Telegram vero, che aspetta me", punto_focale: centro, adatta: intera }
    - nome: OpenClaw
      titolo: La base *dei miei agenti.*
      come_lo_uso: Ci girano i miei agenti personali, su Telegram e WhatsApp. Dalla sua console scelgo l'agente e dove lavora, poi gli do il compito. Ogni agente ha permessi propri, e ogni notte un controllo mi manda un resoconto.
      immagine: { src: /media/strumenti/uso/openclaw.webp, alt: "Il campo di OpenClaw «Su cosa deve lavorare questa sessione?» con quattro suggerimenti per iniziare", punto_focale: centro, adatta: intera }
      accanto:
        immagine: { src: /media/strumenti/uso/openclaw-regole.webp, alt: "Estratto delle regole dei miei agenti, «Paletti non negoziabili»: niente dati privati fuori di qui; cambiare stato si chiede; i segreti stanno nel Portachiavi; niente verde senza prova. Le stesse regole sono copiate in ogni agente che può eseguire comandi", punto_focale: centro, adatta: intera }
        immagine_telefono: { src: /media/progetti/agenti-regole.webp, alt: "Estratto delle regole dei miei agenti, «Paletti non negoziabili»: niente dati privati fuori di qui; cambiare stato si chiede; i segreti stanno nel Portachiavi; niente verde senza prova", punto_focale: alto, adatta: intera }
    - nome: Hermes Agent
      titolo: Il secondo sistema, *separato.*
      come_lo_uso: Ha configurazione e chiavi sue e nessuna porta aperta verso l'esterno. Lo uso per controllare OpenClaw e, se serve, per correggerne la configurazione.
      immagine: { src: /media/strumenti/uso/hermes-agent.webp, alt: "Chiedo a Hermes Agent di controllare in sola lettura la configurazione di OpenClaw: lancia il controllo e risponde che la configurazione è valida", punto_focale: centro, adatta: intera }
      immagine_telefono: { src: /media/strumenti/uso/hermes-agent-telefono.webp, alt: "Chiedo a Hermes Agent di controllare in sola lettura la configurazione di OpenClaw: lancia il controllo e risponde che la configurazione è valida", punto_focale: centro, adatta: intera }
    - nome: OpenCode
      titolo: Più controlli *in parallelo.*
      come_lo_uso: Lancio più controlli insieme, ognuno con un sotto-agente che guarda una cosa sola, per esempio i testi, l'accessibilità, i casi che i test non coprono. Alla fine ho un riassunto per ciascuno.
      immagine: { src: /media/strumenti/uso/opencode.webp, alt: "OpenCode controlla PrivacyBridge con tre sotto-agenti in parallelo, senza modificare nulla: README, accessibilità della pagina e casi di IBAN non coperti dai test, poi riassume l'esito di ciascuno", punto_focale: centro, adatta: intera }
      immagine_telefono: { src: /media/strumenti/uso/opencode-telefono.webp, alt: "OpenCode controlla PrivacyBridge con tre sotto-agenti in parallelo, senza modificare nulla: README, accessibilità della pagina e casi di IBAN non coperti dai test, poi riassume l'esito di ciascuno", punto_focale: centro, adatta: intera }
    - nome: Codex
      titolo: Una seconda *opinione.*
      come_lo_uso: Lo uso come seconda opinione, in sola lettura. Rilegge il codice e mi dice cosa resterebbe scoperto, prima che io tocchi qualcosa. Per ogni lavoro scelgo io se usare Claude Code o Codex.
      immagine: { src: /media/strumenti/uso/codex.webp, alt: "Chiedo a Codex, in sola lettura, quali formati di IBAN il riconoscimento di PrivacyBridge lascerebbe scoperti: legge il file e risponde in tre punti, con un esempio ciascuno", punto_focale: centro, adatta: intera }
      immagine_telefono: { src: /media/strumenti/uso/codex-telefono.webp, alt: "Chiedo a Codex, in sola lettura, quali formati di IBAN il riconoscimento di PrivacyBridge lascerebbe scoperti: legge il file e risponde in tre punti, con un esempio ciascuno", punto_focale: centro, adatta: intera }
    - nome: n8n
      titolo: I flussi *che aspettano il sì.*
      come_lo_uso: Ci orchestro caroselli, storie, newsletter e posta. Ogni contenuto aspetta il mio sì su Telegram, e un flusso a parte controlla che gli altri siano in funzione.
      video:
        mp4: /media/video/n8n-flusso.mp4
        webm: /media/video/n8n-flusso.webm
        copertina: /media/video/n8n-flusso.jpg
        descrizione: "Il flusso del carosello in n8n si accende passo per passo: sceglie la categoria, cerca le notizie, scrive i testi, impagina e manda tutto su Telegram, dove aspetta il mio sì"
        punto_focale: centro
        adatta: riempi
    - nome: Ollama
      titolo: Modelli *sul mio computer.*
      come_lo_uso: Uso modelli sul mio computer per i testi che non devono uscire, per esempio la memoria dei miei agenti. Con i dati riservati di un cliente è la prima strada che valuto.
      immagine: { src: /media/strumenti/uso/ollama.webp, alt: "Un modello di Ollama, sul mio computer, riassume in una riga un appunto di sei punti", punto_focale: centro, adatta: intera }
      immagine_telefono: { src: /media/strumenti/uso/ollama-telefono.webp, alt: "Un modello di Ollama, sul mio computer, riassume in una riga un appunto di sei punti", punto_focale: centro, adatta: intera }
